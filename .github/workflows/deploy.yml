name: Test and deploy

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run rather than racing it to deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webapp/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix webapp ci

      # Every project runs Chromium; no other browser is needed.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build the frontend
        run: npm run build:web

      # Starts its own wrangler dev and ntfy stub, against an isolated local
      # D1 seeded from schema.sql — no Cloudflare credentials needed here.
      - name: Run the suite
        run: npx playwright test

      - name: Upload the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/.results
            playwright-report
          retention-days: 7

  deploy:
    needs: test
    # Only a real push to main ships; pull requests stop at the tests above.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webapp/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix webapp ci

      # The Worker serves webapp/out as static assets, so the frontend must be
      # built before publishing or a stale bundle ships.
      - name: Build the frontend
        run: npm run build:web

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
